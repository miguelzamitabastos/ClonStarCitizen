# Curated points of interest (P4-07). Loaded once into a PoiCatalog singleton by
# world::load_poi_catalog. Sections: [[poi]] then key=value.
#
#   id            stable, UNIQUE text id — "poi.<name>". Required.
#   name          display name.
#   kind          station | outpost | beacon | wreck
#   system        home  (= the fixed system, P4-04)  OR a raw u64 seed
#   placement     orbit | planet_surface | absolute
#   orbit_*       placement=orbit: orbit_radius, orbit_angle_deg, orbit_y
#   planet_index  placement=planet_surface: which Planet body (0-based)
#   lat_deg lon_deg altitude   placement=planet_surface: point on the sphere
#   pos           placement=absolute: "x,y,z"
#   marker_radius render/hit radius
#   location_id   optional: a locations.cfg id whose NPCs spawn at this POI
#
# All POIs below sit in the home system. Positions relative to its star (origin).

[[poi]]
id=poi.deep-space-relay
name=Deep Space Relay
kind=beacon
system=home
placement=orbit
orbit_radius=6200
orbit_angle_deg=145
orbit_y=180
marker_radius=18

[[poi]]
id=poi.frontier-outpost
name=Frontier Outpost
kind=outpost
system=home
placement=orbit
orbit_radius=4200
orbit_angle_deg=300
orbit_y=-60
marker_radius=32

[[poi]]
id=poi.derelict-hauler
name=Derelict Hauler
kind=wreck
system=home
placement=absolute
pos=-1800,40,900
marker_radius=14

[[poi]]
id=poi.ridge-camp
name=Ridge Camp
kind=outpost
system=home
placement=planet_surface
planet_index=0
lat_deg=28
lon_deg=-115
altitude=6
marker_radius=10
