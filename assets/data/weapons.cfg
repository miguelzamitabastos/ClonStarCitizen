# Weapon catalog (P3-05). Loaded once at init into a WeaponCatalog singleton by
# flight::load_weapon_catalog. Sections: [[weapon]] then key=value fields.
#
# Same rule as ships.cfg: a new gun is a NEW [[weapon]] entry here — no engine
# code. Ship hardpoints (ships.cfg `weapon_id_N`) and turrets name the weapon
# they carry by `id`; apply_ship_def_components / spawn_turret copy these stats
# onto the live WeaponMount.
#
#   id           stable, UNIQUE text id — "weapon.<mount>.<name>". Required.
#                A duplicate / missing id FAILS the load (loud, no silent default).
#   name         display name for HUD / fitting UI.
#   mount        informational: fixed | turret
#   damage       per shot (projectile) or per hit (hitscan)
#   cooldown     seconds between shots
#   energy_cost  power-plant units drawn per shot
#   heat_max     WeaponMount heat ceiling
#   range        engagement range (m); also feeds turret AiAgent.attack_range
#   hitscan      false = projectile pool, true = instant hit
#
# weapon.fixed.repeater reproduces the Fase 1/2 hardcoded player gun exactly;
# weapon.turret.repeater the Fase 2 turret gun. The rest are P3-05 content.

[[weapon]]
id=weapon.fixed.repeater
name=Repeater
mount=fixed
damage=60
cooldown=0.22
energy_cost=12
heat_max=100
range=500
hitscan=false

[[weapon]]
id=weapon.fixed.cannon
name=Cannon
mount=fixed
damage=130
cooldown=0.70
energy_cost=30
heat_max=140
range=650
hitscan=false

[[weapon]]
id=weapon.fixed.laser
name=Pulse Laser
mount=fixed
damage=32
cooldown=0.10
energy_cost=8
heat_max=120
range=800
hitscan=true

[[weapon]]
id=weapon.turret.repeater
name=Turret Repeater
mount=turret
damage=35
cooldown=0.50
energy_cost=10
heat_max=100
range=350
hitscan=false
