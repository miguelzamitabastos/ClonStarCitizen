# Ship catalog (P3-01). Loaded once at init into a ShipCatalog singleton by
# flight::load_ship_catalog. Sections: [[ship]] then key=value fields.
#
# Fase 3 rule: a new ship is a NEW [[ship]] entry here — no engine code, no
# recompile, no per-type branch. spawn_player_ship / spawn_npc_ship build every
# component from the entry looked up by `id`.
#
#   id                 stable, UNIQUE text id — "ship.<role>.<name>". Required.
#                      A duplicate id or a missing id FAILS the load (loud, no
#                      silent default).
#   name               display name for the hangar / catalog UI (P3-02..03).
#   role               informational tag: fighter | freighter | explorer | multi
#
#   mass_kg            rigid-body mass
#   inertia            body-axis inertia, "Ixx,Iyy,Izz" (kg·m²)
#   hull_radius        collision / hit sphere radius (m)
#   render_scale       ecs::Scale for the placeholder mesh
#
#   main_thrust_n      forward (nose) thruster force        — scales accel
#   maneuver_thrust_n  strafe / attitude thruster force     — scales strafe
#   retro_thrust_n     reverse thruster force
#   max_torque_nm      rotation authority (ShipSpec)        — scales turn rate
#
#   hull_hp            ShipHull max/current hp
#   power_output       PowerPlant units/s
#   power_capacity     PowerPlant reservoir (also starting stored)
#   shield_capacity    ShieldGenerator max/current
#   shield_regen       shield/s
#   shield_power_draw  energy/s at full regen demand
#   subsystem_hp       P2-02 banks, "ENG,SHD,WPN,SEN" max hp (4 values)
#
#   weapon_mounts      number of fixed weapon hardpoints (<= 2)
#   weapon_mount_N     body-space offset of hardpoint N, "x,y,z"
#   turret_hardpoints  number of turret sockets (<= 4)     — placement for P2-03
#   turret_hardpoint_N body-space offset of turret socket N, "x,y,z"
#
#   cargo_volume       CargoHold capacity (m³)
#   cargo_mass         CargoHold capacity (t)
#
# ship.player.default / ship.npc.skiff reproduce the Fase 1/2 hardcoded ships
# exactly (default spawns). P3-02 adds the distinct player-flyable hulls below
# them — fighter / freighter / explorer / heavy — each with perceptibly
# different mass, thrust, torque and cargo. Pick one at launch with
# `--ship=<id>` (honoured by every flight-capable demo scene except
# economy_test); the hangar (P3-03) will make it an in-game choice.

[[ship]]
id=ship.player.default
name=Kestrel
role=multi
mass_kg=45000
inertia=180000,220000,90000
hull_radius=3.5
render_scale=2.2
main_thrust_n=320000
maneuver_thrust_n=90000
retro_thrust_n=200000
max_torque_nm=180000
hull_hp=1000
power_output=450
power_capacity=1200
shield_capacity=600
shield_regen=35
shield_power_draw=90
subsystem_hp=300,250,200,150
weapon_mounts=1
weapon_mount_0=0,-0.5,-3
turret_hardpoints=1
turret_hardpoint_0=0,1.6,0
cargo_volume=40
cargo_mass=100

[[ship]]
id=ship.npc.skiff
name=Pirate Skiff
role=fighter
mass_kg=45000
inertia=180000,220000,90000
hull_radius=3.5
render_scale=2.2
main_thrust_n=320000
