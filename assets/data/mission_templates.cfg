# Mission templates (P1C-04). type: delivery | visit | combat | escort
# Generator rolls qty/reward in [min,max] on accept (discrete event, not per-frame).
# P2-10 combat/escort: qty_min/qty_max double as the hostile-count range (capped
# at kMaxMissionHostiles); target_faction_id is who gets spawned as hostiles —
# separate from faction_id/rep_delta, which stay the reward reputation.
# P2-09 chained missions:
#   requires_completed_id — omit for "always offerable"; otherwise only offerable
#     once the template with that id has been completed.
#   branch_group — 0 = no branch. Nonzero: templates sharing a group are mutually
#     exclusive — accepting one locks out every other template in the group
#     immediately (at accept time, not completion).

[[template]]
id=0
type=delivery
name=OreDelivery
commodity_id=0
qty_min=5
qty_max=8
reward_min=180
reward_max=280
faction_id=0
rep_delta=0.08
from_market=0
to_market=1

[[template]]
id=1
type=visit
name=ScoutMarketB
commodity_id=0
qty_min=0
qty_max=0
reward_min=60
reward_max=90
faction_id=1
rep_delta=0.03
from_market=0
to_market=1

# P2-09: unlocked only after OreDelivery (id=0) completes — two mutually
# exclusive follow-ups (branch_group=1), representing which faction the
# player chooses to help next with the goodwill earned from the ore run.
[[template]]
id=2
type=delivery
name=ColonistAid
commodity_id=2
qty_min=3
qty_max=5
reward_min=100
reward_max=150
faction_id=2
rep_delta=0.10
from_market=1
to_market=0
requires_completed_id=0
branch_group=1

[[template]]
id=3
type=delivery
name=SecurityRun
commodity_id=1
qty_min=2
qty_max=4
reward_min=100
reward_max=150
faction_id=1
rep_delta=0.10
from_market=1
to_market=0
requires_completed_id=0
branch_group=1

# P2-10: clear pirates (faction 3) near MarketB, turn in at the same market's
# existing turn-in NPC (mission_try_complete_at_market matches by market_id,
# not by template — the OreDelivery turn-in NPC already there handles it too).
[[template]]
id=4
type=combat
name=ClearPirates
target_faction_id=3
qty_min=2
qty_max=3
reward_min=150
reward_max=220
faction_id=1
rep_delta=0.12
from_market=1
to_market=1

# P2-10: protect a trader from a pirate ambush — fails immediately (no
# reward) if the trader dies before every pirate is down.
[[template]]
id=5
type=escort
name=EscortTrader
target_faction_id=3
qty_min=2
qty_max=2
reward_min=200
reward_max=260
faction_id=0
rep_delta=0.15
from_market=1
to_market=1
