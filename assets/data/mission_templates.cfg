# Mission templates (P1C-04). type: delivery | visit
# Generator rolls qty/reward in [min,max] on accept (discrete event, not per-frame).
# P2-09 chained missions:
#   requires_completed_id — omit for "always offerable"; otherwise only offerable
#     once the template with that id has been completed.
#   branch_group — 0 = no branch. Nonzero: templates sharing a group are mutually
#     exclusive — accepting one locks out every other template in the group
#     immediately (at accept time, not completion).

[[template]]
id=0
type=delivery
name=OreDelivery
commodity_id=0
qty_min=5
qty_max=8
reward_min=180
reward_max=280
faction_id=0
rep_delta=0.08
from_market=0
to_market=1

[[template]]
id=1
type=visit
name=ScoutMarketB
commodity_id=0
qty_min=0
qty_max=0
reward_min=60
reward_max=90
faction_id=1
rep_delta=0.03
from_market=0
to_market=1

# P2-09: unlocked only after OreDelivery (id=0) completes — two mutually
# exclusive follow-ups (branch_group=1), representing which faction the
# player chooses to help next with the goodwill earned from the ore run.
[[template]]
id=2
type=delivery
name=ColonistAid
commodity_id=2
qty_min=3
qty_max=5
reward_min=100
reward_max=150
faction_id=2
rep_delta=0.10
from_market=1
to_market=0
requires_completed_id=0
branch_group=1

