# Location population (P3-04). Loaded once at init into a LocationCatalog
# singleton by economy::load_location_catalog. Sections: [[location]] then
# key=value, with an indexed npc list.
#
# The SCENE decides where each location sits (its world origin, via a
# LocationPlacement table); this file decides WHAT populates it. Adding an NPC,
# a shop or a mission giver to a location = a new npc.N.* block here, no C++.
#
#   id            stable, UNIQUE text id — "loc.<name>". Required.
#   name          display name.
#   location_id   integer id shared with markets.cfg / travel pads / visit missions.
#   gravity_deck  1 = populate_locations also spawns a gravity zone + deck marker.
#
#   npc.N.kind    trader | mission_giver | turn_in | travel_pad
#   npc.N.offset  "x,y,z" relative to the location origin
#   npc.N.label   interaction prompt (<= 31 chars)
#   trader:        npc.N.market  npc.N.commodity  npc.N.buy(0/1)  npc.N.sell(0/1)
#   mission_giver / turn_in:  npc.N.template  npc.N.mission_market
#   travel_pad:    npc.N.dest = destination location id (must be placed by the scene)
#
# loc.market-a / loc.market-b reproduce the Fase 1C hand-placed economy_test
# NPCs exactly (incl. the P2-09 branch missions and P2-10 combat/escort at B).
# loc.outpost-c is the P3-04 expansion — a third populated stop.

