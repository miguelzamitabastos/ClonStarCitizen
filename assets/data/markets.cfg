# Markets (P1C-01). stock_N / price_mod_N index commodity id N.
# price_mod multiplies base_price before supply/demand adjustment.
# ideal_stock used by price(stock) curve (defaults to 50 if omitted).
# rate_N (P2-08): units/second this market produces (+) or consumes (-) of
# commodity N in the background, applied once per economic tick (~15s of game
# time, see EconomyClock) — independent of player buy/sell. Omitted = 0 (no
# local activity for that commodity).

[[market]]
id=0
name=MarketA
location_id=0
ideal_stock=80
# Cheap ore (buy here), modest electronics — an ore-producing outpost.
stock_0=120
price_mod_0=0.65
stock_1=30
price_mod_1=1.05
stock_2=20
price_mod_2=1.0
rate_0=1.5

[[market]]
id=1
name=MarketB
location_id=1
ideal_stock=80
# Expensive ore (sell here for margin) — a refinery consuming ore locally.
stock_0=15
price_mod_0=1.55
stock_1=40
price_mod_1=0.95
stock_2=25
price_mod_2=1.1
rate_0=-1.0
