# Suit / armour catalog (P3-06). Loaded once at init into a SuitCatalog
# singleton by character::load_suit_catalog. Sections: [[suit]] then key=value.
#
# Same rule as ships.cfg / weapons.cfg: a new suit is a NEW [[suit]] entry —
# no engine code. The player wears one (spawn_player_character or a suit-locker
# kiosk); its stats hook into character damage and EVA locomotion.
#
#   id                    stable, UNIQUE text id — "suit.<class>.<name>". Required.
#   name                  display name (<= 23 chars).
#   damage_reduction      [0, 0.95] fraction of incoming character damage absorbed.
#   eva_capacity          EVA propellant reservoir (units).
#   eva_drain_per_sec     propellant used while thrusting in EVA.
#   eva_recharge_per_sec  propellant regained while grounded / in a gravity zone.
#   move_speed_mult       on-foot walk-speed multiplier.
#
# suit.flight.standard is the default — its values leave Fase 1B behaviour
# unchanged (no reduction, generous EVA, normal speed).

[[suit]]
id=suit.flight.standard
name=Flight Suit
damage_reduction=0.0
eva_capacity=100
eva_drain_per_sec=12
eva_recharge_per_sec=20
move_speed_mult=1.0

[[suit]]
id=suit.eva.explorer
name=EVA Explorer
damage_reduction=0.10
eva_capacity=240
eva_drain_per_sec=7
eva_recharge_per_sec=24
move_speed_mult=0.95

[[suit]]
id=suit.armor.heavy
name=Heavy Armor
damage_reduction=0.45
eva_capacity=55
eva_drain_per_sec=16
eva_recharge_per_sec=13
move_speed_mult=0.8

[[suit]]
id=suit.light.scout
name=Scout Skin
damage_reduction=0.0
eva_capacity=90
eva_drain_per_sec=10
eva_recharge_per_sec=22
move_speed_mult=1.2
