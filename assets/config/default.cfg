# ClonStarCitizen default configuration (key=value).
# Loaded once at startup; CLI overrides may follow (e.g. --scene=name).
#
# Demo scenes (P0-12):
#   grid_freelook      — camera + ground grid (default, minimal)
#   instancing_stress  — 600 shared-mesh cubes / 1 draw + grid
#   mesh_viewer        — single centered cube + free-look
# Launch: ./clon_star_citizen --scene=instancing_stress

window_width=1280
window_height=720
window_title=ClonStarCitizen

mouse_sensitivity=0.0025
move_speed=8.0
fov_y_degrees=60.0
physics_fixed_hz=60.0

scene_name=grid_freelook
log_level=info
