# ClonStarCitizen default configuration (key=value).
# Loaded once at startup; CLI overrides may follow (e.g. --scene=name).
#
# Demo scenes:
#   grid_freelook      — camera + ground grid (default, minimal)
#   instancing_stress  — 600 shared-mesh cubes / 1 draw + grid
#   mesh_viewer        — single centered cube + free-look
#   flight_test        — pilotable ship (P1A)
#   on_foot_test       — interior / EVA / station (P1B)
#   universe_test      — station ↔ open space (rebase) ↔ LZ (P1D)
# Launch: ./clon_star_citizen --scene=universe_test

window_width=1280
window_height=720
window_title=ClonStarCitizen
# Undecorated window at monitor resolution — avoids WSLg window-manager
# decoration quirks. Override with --windowed on the command line.
borderless_fullscreen=1

mouse_sensitivity=0.0025
move_speed=8.0
fov_y_degrees=60.0
physics_fixed_hz=60.0

scene_name=grid_freelook
log_level=info
